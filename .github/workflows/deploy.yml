name: Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        name: Deploy
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm run bundle
            - uses: actions/upload-artifact@v4
              with:
                  name: monetizationos-akamai-proxy
                  path: monetizationos-akamai-proxy.tgz
                  retention-days: 30
